# OPVARYN deployment topology (ADR 0009).
#
# Default (`docker compose up` / `make docker-up`): PostgreSQL only, for local
# development where the API and web app run on the host through `make dev`.
#
# Profile `pilot` (`make pilot-up`): the whole product on one internal host —
# migrations, API, web app and the backup job. The web image is built from the
# repository root because it consumes the workspace contracts package.
name: opvaryn

x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

x-api-env: &api-env
  DATABASE_URL: postgres://${POSTGRES_USER:-opvaryn}:${POSTGRES_PASSWORD:-opvaryn}@postgres:5432/${POSTGRES_DB:-opvaryn}?sslmode=disable
  API_ENV: ${API_ENV:-development}
  API_LOG_LEVEL: ${API_LOG_LEVEL:-info}
  API_PORT: '21501'
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:21500}
  TZ: ${TZ:-Asia/Ho_Chi_Minh}

services:
  postgres:
    image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-opvaryn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-opvaryn}
      POSTGRES_DB: ${POSTGRES_DB:-opvaryn}
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    ports:
      # Bound to the documented 21xxx range so it cannot collide with other
      # local projects (see .env.example).
      - '${POSTGRES_PORT:-21532}:5432'
    volumes:
      # PostgreSQL 18 images use a version-aware data layout: mount the parent
      # directory, not /var/lib/postgresql/data.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER:-opvaryn} -d $${POSTGRES_DB:-opvaryn}']
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *logging
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1g

  # One-shot: applies every migration the API image carries, then exits. `api`
  # waits for it to finish successfully, so a deploy never serves an unmigrated
  # database and a failed migration stops the rollout instead of half-starting it.
  # The entrypoint is replaced (not the command): the image's entrypoint is the
  # server, and a one-shot service must not inherit it.
  migrate:
    profiles: ['pilot']
    build:
      context: ./apps/api
    image: ${OPVARYN_API_IMAGE:-opvaryn-api:local}
    entrypoint: ['/app/migrate']
    environment: *api-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'
    # The image's HTTP healthcheck does not apply to a process that exits.
    healthcheck:
      disable: true
    logging: *logging

  api:
    profiles: ['pilot']
    build:
      context: ./apps/api
    image: ${OPVARYN_API_IMAGE:-opvaryn-api:local}
    restart: unless-stopped
    environment: *api-env
    ports:
      # Loopback only: ops reach it on the host, the network does not. Public traffic
      # arrives through caddy (ADR 0009).
      - '127.0.0.1:${API_PORT:-21501}:21501'
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:21501/readyz >/dev/null 2>&1 || exit 1']
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 5
    logging: *logging
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512m

  web:
    profiles: ['pilot']
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: ${OPVARYN_WEB_IMAGE:-opvaryn-web:local}
    restart: unless-stopped
    environment:
      # Server-side only: the browser never talks to the API directly (ADR 0008).
      API_BASE_URL: http://api:21501
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    ports:
      # Loopback only, for debugging the app without going through the proxy.
      - '127.0.0.1:${WEB_PORT:-21500}:21500'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:21500/ >/dev/null 2>&1 || exit 1']
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 5
    logging: *logging
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 768m

  # The only service published to the network: TLS terminates here (ADR 0009).
  caddy:
    profiles: ['pilot']
    image: caddy:2-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    restart: unless-stopped
    environment:
      OPVARYN_HOSTNAME: ${OPVARYN_HOSTNAME:-opvaryn.local}
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    ports:
      - '${CADDY_HTTP_PORT:-80}:80'
      - '${CADDY_HTTPS_PORT:-443}:443'
    volumes:
      - ./deployments/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Caddy's internal CA and issued certificates live in /data; losing it only
      # means re-issuing, so it is a volume and not a bind mount.
      - caddy_data:/data
      - caddy_config:/config
    extra_hosts:
      # The healthcheck talks TLS to the same name the proxy serves (Caddy only
      # answers for that SNI), so a refused handshake or a missing certificate shows
      # up as unhealthy instead of passing silently.
      - '${OPVARYN_HOSTNAME:-opvaryn.local}:127.0.0.1'
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget -q --no-check-certificate -O /dev/null "https://$${OPVARYN_HOSTNAME}/" || exit 1',
        ]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 5
    logging: *logging

  # Backup job: a loop around scripts/backup-db.sh (pg_dump + verify + retention).
  # It reuses the PostgreSQL image, so pg_dump matches the server version exactly.
  # Dumps land on the host through the bind mount; a backup that never leaves the
  # database host is not a backup, so BACKUP_DIR should point at a second disk or
  # a synced directory (see docs/ops-runbook.md).
  backup:
    profiles: ['pilot']
    image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    restart: unless-stopped
    # The job writes into a bind mount owned by the host user, so it runs as root
    # inside its own container: the only thing it can touch is the dump directory,
    # and a uid mismatch would otherwise make every backup fail on permissions.
    user: '0'
    environment:
      PGHOST: postgres
      PGPORT: '5432'
      PGPASSWORD: ${POSTGRES_PASSWORD:-opvaryn}
      PGUSER: ${POSTGRES_USER:-opvaryn}
      PGDATABASE: ${POSTGRES_DB:-opvaryn}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        while true; do
          sh /usr/local/bin/backup-db.sh || echo "backup: run failed, will retry at the next interval"
          sleep "$${BACKUP_INTERVAL_SECONDS}"
        done
    volumes:
      - ./scripts/backup-db.sh:/usr/local/bin/backup-db.sh:ro
      - ${BACKUP_DIR:-./deployments/backups}:/backups
    depends_on:
      postgres:
        condition: service_healthy
    logging: *logging

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
