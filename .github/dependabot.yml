# Dependency updates. Only the ecosystems Dependabot supports are listed here;
# the mise tool pins (go, node, pnpm, Go analysis tools) are updated by hand in
# mise.toml + mise.lock, and container digests follow the same manual review
# (this repository deliberately does not use Renovate).
#
# Policy: minor and patch updates arrive grouped as pull requests. Major upgrades
# are deliberate decisions, so they are not automated here — they would otherwise
# arrive as unreviewed surprise PRs (e.g. TypeScript 7). `ignore` with
# `update-types` only suppresses version updates: Dependabot alerts and security
# updates still fire, so a vulnerable major is never hidden.
# GitHub Actions are the exception: action majors must be picked up because older
# majors stop working when their runtime is retired.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /apps/api
    schedule:
      interval: weekly
      day: tuesday
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'deps(go)'
    groups:
      go-minor-patch:
        patterns: ['*']
        update-types: [minor, patch]
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'deps(web)'
    groups:
      next-react-stack:
        patterns: ['next', 'react', 'react-dom', '@types/react', '@types/react-dom', 'eslint-config-next']
        update-types: [minor, patch]
      npm-minor-patch:
        patterns: ['*']
        update-types: [minor, patch]
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  # GitHub Actions stay fully automated, majors included: actions must keep up
  # with GitHub's runtime retirements, and every bump is a reviewed pull request.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: wednesday
      timezone: Asia/Ho_Chi_Minh
    commit-message:
      prefix: 'deps(actions)'

  - package-ecosystem: docker-compose
    directory: /deployments
    schedule:
      interval: weekly
      day: thursday
      timezone: Asia/Ho_Chi_Minh
    commit-message:
      prefix: 'deps(docker)'
    ignore:
      # A PostgreSQL major upgrade needs a migration and restore plan, not a
      # drive-by pull request.
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  # Base images of the two images this repository builds. They are pinned by
  # digest, so a pull request is the only way they move.
  - package-ecosystem: docker
    directory: /apps/api
    schedule:
      interval: weekly
      day: thursday
      timezone: Asia/Ho_Chi_Minh
    commit-message:
      prefix: 'deps(docker)'
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: docker
    directory: /apps/web
    schedule:
      interval: weekly
      day: thursday
      timezone: Asia/Ho_Chi_Minh
    commit-message:
      prefix: 'deps(docker)'
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
