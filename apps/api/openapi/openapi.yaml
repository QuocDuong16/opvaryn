            maxLength: 100
        - name: limit
          in: query
          required: false
          description: Rows per page (default 25, maximum 100).
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: offset
          in: query
          required: false
          description: Rows to skip.
          schema:
            type: integer
            minimum: 0
            default: 0
      security:
        - sessionCookie: []
      responses:
        '200':
          description: One page of roles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminRoleList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      operationId: createAdminRole
      tags: [administration]
      summary: Add one role to the catalogue
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAdminRoleRequest'
      responses:
        '201':
          description: The created role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminRole'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/admin/roles/{key}:
    put:
      operationId: updateAdminRole
      tags: [administration]
      summary: Rename one role
      description: 'The key stays fixed: process nodes and authorization compare it.'
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/AdminKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAdminRoleRequest'
      responses:
        '200':
          description: The updated role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminRole'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    delete:
      operationId: deleteAdminRole
      tags: [administration]
      summary: Delete a role nothing depends on
      description: |
        Refused for a platform role (`admin`, `process_designer`), a role somebody holds, and a
        role named by any published process version.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/AdminKey'
      responses:
        '204':
          description: The role is gone
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Something still depends on the role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/attachments:
    post:
      operationId: uploadAttachment
      tags: [attachments]
      summary: Upload one file for a record field
      description: |
        Uploads a file and returns its identifier. A file starts unbound; it is attached to
        the record when the form that references its identifier is saved. Only the uploader
        (or an administrator) may bind it, and a file is bound once. The content type is
        sniffed from the bytes; the size cap is 10 MB.
      security:
        - sessionCookie: []
      parameters:
        - name: objectKey
          in: query
          required: true
          description: The business object the file will belong to.
          schema:
            type: string
            pattern: '^[a-z][a-z0-9_]{1,63}$'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: The stored file
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attachment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/attachments/{attachmentId}:
    get:
      operationId: downloadAttachment
      tags: [attachments]
      summary: Download one file
      description: |
        Streams the bytes as an attachment. A file is visible to its uploader while unbound
        and to the record's readers once bound; a hidden file answers 404. The response is
        always served as a download with `nosniff`, never rendered in the browser.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/AttachmentId'
      responses:
        '200':
          description: The file bytes
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    delete:
      operationId: deleteAttachment
      tags: [attachments]
      summary: Remove an upload that never became part of a record
      description: |
        Only an unbound file uploaded by the caller (or an administrator) can be removed.
        A bound file belongs to its record and is replaced or deleted with it.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/AttachmentId'
      responses:
        '204':
          description: The upload is gone
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The file belongs to a record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/metrics:
    get:
      operationId: listMetrics
      tags: [metrics]
      summary: List the metric definitions
      description: |
        Reading configuration is open to any signed-in user, like reading business object
        or process definitions.
      security:
        - sessionCookie: []
      parameters:
        - name: limit
          in: query
          required: false
          description: Rows per page (default 25, maximum 100).
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: offset
          in: query
          required: false
          description: Rows to skip.
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Metric definitions, ordered by key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricDefinitionList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      operationId: createMetricDefinition
      tags: [metrics]
      summary: Create a metric definition
      description: |
        A metric counts records of one business object or measures one numeric field of
        it, optionally filtered by the same JSON condition process branches use (D04) and
        optionally grouped by one select, text or date field. Requires `admin` or
        `process_designer`: a metric is configuration. Field kinds are resolved when the
        metric is saved, so a later schema edit does not change what a metric measures.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMetricDefinitionRequest'
      responses:
        '201':
          description: Metric created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricDefinition'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The signed-in user is not an admin or a process designer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/metrics/{key}:
    get:
      operationId: getMetricDefinition
      tags: [metrics]
      summary: Read one metric definition
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/MetricKey'
      responses:
        '200':
          description: The metric definition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricDefinition'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    put:
      operationId: updateMetricDefinition
      tags: [metrics]
      summary: Replace a metric definition
      description: |
        The key is the identity: a saved dashboard layout points at it, so it cannot be
        changed. Everything else may be replaced. Requires `admin` or `process_designer`.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/MetricKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMetricDefinitionRequest'
      responses:
        '200':
          description: The updated metric definition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricDefinition'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The signed-in user is not an admin or a process designer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/metrics/{key}/result:
    get:
      operationId: getMetricResult
      tags: [metrics]
      summary: Answer a metric over the records the caller may see
      description: |
        The result is scoped exactly like a record read (ADR 0008): department, own
        records, and records whose instance holds an open task for a role the caller has.
        Two people can therefore see different numbers for the same metric, which is the
        point of department scoping and is stated on the screen. The total is computed
        over every visible record; buckets (when the metric groups) are the biggest 50.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/MetricKey'
      responses:
        '200':
          description: The metric and what it currently answers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/webhook-deliveries:
    get:
      operationId: listWebhookDeliveries
      tags: [integrations]
      summary: Recent outbound webhook deliveries
      description: |
        The delivery log of the outbound integration (ADR 0012): what was announced to the
        outside world, how many attempts it took, and why the last one failed. It is what
        makes integration failures visible to an operator instead of only to a log file.
        Requires `admin` or `process_designer`.
      security:
        - sessionCookie: []
      parameters:
        - name: limit
          in: query
          required: false
          description: How many deliveries to return, newest first (default 25, maximum 100).
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: offset
          in: query
          required: false
          description: Rows to skip.
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: The delivery log
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookDeliveryList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The signed-in user is not an admin or a process designer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/process-metrics:
    get:
      operationId: getProcessMetrics
      tags: [metrics]
      summary: How the engine is doing over a window
      description: |
        The operational read model (ADR 0011): instances started, completed, rejected and
        running, end-to-end cycle time, task decision time, approval rate and rework rate —
        computed from the typed columns of process_instances and process_tasks, not from
        record fields, which is why this is a fixed catalogue rather than a user-defined
        metric (D06). Everything is scoped to the instances the caller may see, like any
        other read (ADR 0008); a rate over nothing is absent, never zero. SLA breach is not
        here: the engine has no SLA policy yet (ADR 0007 section 12).
      security:
        - sessionCookie: []
      parameters:
        - name: definitionKey
          in: query
          required: false
          description: Only instances of this process definition.
          schema:
            type: string
            example: purchase_approval
        - name: windowDays
          in: query
          required: false
          description: How far back to look; 1–365, default 30.
          schema:
            type: integer
            minimum: 1
            maximum: 365
            default: 30
      responses:
        '200':
          description: The overview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessMetricsOverview'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/tasks:
    get:
      operationId: listInboxTasks
      tags: [task-inbox]
      summary: Open tasks of the signed-in user
      description: |
        One page of the open tasks whose role the signed-in user holds, oldest first,
        together with the instance it belongs to, and the total behind the page. `q`
        searches the task title and the process name.
      parameters:
        - name: q
          in: query
          required: false
          description: Search term matched against the task title and the process name. Empty means no filter.
          schema:
            type: string
            maxLength: 100
        - name: limit
          in: query
          required: false
          description: Rows per page (default 25, maximum 100).
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: offset
          in: query
          required: false
          description: Rows to skip.
          schema:
            type: integer
            minimum: 0
            default: 0
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Open tasks, oldest first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboxList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/process-definitions:
    get:
      operationId: listProcessDefinitions
      tags: [process-definitions]
      summary: List process definitions
      description: |-
        One page of definitions with the total behind it. `q` searches the name and the key.
      parameters:
        - name: q
          in: query
          required: false
          description: Search term matched against the name and the key. Empty means no filter.
          schema:
            type: string
            maxLength: 100
        - name: limit
          in: query
          required: false
          description: Rows per page (default 25, maximum 100).
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: offset
          in: query
          required: false
          description: Rows to skip.
          schema:
            type: integer
            minimum: 0
            default: 0
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Process definitions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessDefinitionList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      operationId: createProcessDefinition
      tags: [process-definitions]
      summary: Create a process definition and publish version 1
      description: |
        Validates the graph (one start, at least one end and one human task, DAG,
        reachable nodes, condition branches) and the conditions against the field
        definitions of the bound business object, then publishes version 1.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProcessDefinitionRequest'
      security:
        - sessionCookie: []
      responses:
        '201':
          description: Process definition created and published
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessDefinition'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/process-definitions/{key}:
    get:
      operationId: getProcessDefinition
      tags: [process-definitions]
      summary: Get one process definition with its newest published version
      parameters:
        - $ref: '#/components/parameters/DefinitionKey'
      security:
        - sessionCookie: []
      responses:
        '200':
          description: The process definition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessDefinition'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    put:
      operationId: updateProcessDefinition
      tags: [process-definitions]
      summary: Publish the next version of a process definition
      description: |
        Validates the new graph exactly like creation and publishes the next immutable
        version. Instances keep running on the version they started with.
      parameters:
        - $ref: '#/components/parameters/DefinitionKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProcessDefinitionRequest'
      security:
        - sessionCookie: []
      responses:
        '200':
          description: The definition with its newly published version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessDefinition'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/process-definitions/{key}/versions:
    get:
      operationId: listProcessDefinitionVersions
      tags: [process-definitions]
      summary: List the published versions of a process definition
      parameters:
        - $ref: '#/components/parameters/DefinitionKey'
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Published versions, newest first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessDefinitionVersionList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/process-instances:
    get:
      operationId: listProcessInstances
      tags: [process-runtime]
      summary: List the instances the signed-in user may see
      description: |
        Scoped exactly like the record each instance runs on (ADR 0008): an instance is
        listed only when its record is visible to the caller, and a caller who holds the
        role of an open task sees it through that task. Optional filters narrow the list
        to one business object, one process definition or one record; newest first, one
        page at a time, with the total behind the page.
      security:
        - sessionCookie: []
      parameters:
        - name: objectKey
          in: query
          required: false
          description: Only instances of this business object.
          schema:
            type: string
            example: purchase_request
        - name: definitionKey
          in: query
          required: false
          description: Only instances of this process definition.
          schema:
            type: string
            example: purchase_approval
        - name: recordId
          in: query
          required: false
          description: |
            Only the runs of this one record, which is what a record's own screen asks
            for. The record is still subject to the visibility rule, so an invisible
            record answers an empty list rather than confirming that it exists.
          schema:
            type: string
            format: uuid
            example: 6f1e0a5c-2f6a-4a1d-9c2b-2a0f1f2f3f40
        - name: limit
          in: query
          required: false
          description: Rows per page (default 25, maximum 100).
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: offset
          in: query
          required: false
          description: Rows to skip.
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: The visible instances, newest first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessInstanceList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      operationId: startProcessInstance
      tags: [process-runtime]
      summary: Start a process instance from a stored record
      description: |
        Binds the instance to the definition version current at start and walks the
        graph to its first waiting human task (or straight to the end). The actor is
        the signed-in user; there is no way to claim one from the body.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartProcessInstanceRequest'
      responses:
        '201':
          description: Instance started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessInstanceView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/process-instances/{instanceId}:
    get:
      operationId: getProcessInstance
      tags: [process-runtime]
      summary: Get an instance with its tasks and its event log
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/InstanceId'
      responses:
        '200':
          description: The instance, its tasks and its events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessInstanceView'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/process-instances/{instanceId}/tasks/{taskId}/decisions:
    post:
      operationId: decideProcessTask
      tags: [process-runtime]
      summary: Decide one human task (approve, return, reject)
      description: |
        Applies exactly one decision. Approve advances along the graph, return resets
        the instance to a new attempt, reject is terminal. The task is decided with a
        compare-and-swap, so a second caller gets 409 instead of applying a second
        transition. The task role must be one the signed-in user holds.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/InstanceId'
        - $ref: '#/components/parameters/TaskId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecideProcessTaskRequest'
      responses:
        '200':
          description: The instance after the decision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessInstanceView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The signed-in user does not hold the role the task was assigned to
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: opvaryn.session
      description: |
        Session cookie set by `POST /auth/login`. The token is httpOnly on the client and
        only its hash is stored server-side (ADR 0008).
  parameters:
    ObjectKey:
      name: key
      in: path
      required: true
      description: Stable machine key of the business object.
      schema:
        type: string
        pattern: '^[a-z][a-z0-9_]{1,63}$'
    DefinitionKey:
      name: key
      in: path
      required: true
      description: Stable machine key of the process definition.
      schema:
        type: string
        pattern: '^[a-z][a-z0-9_]{1,63}$'
    MetricKey:
      name: key
      in: path
      required: true
      description: Stable machine key of the metric.
      schema:
        type: string
        pattern: '^[a-z][a-z0-9_]{1,63}$'
    InstanceId:
      name: instanceId
      in: path
      required: true
      description: Process instance identifier.
      schema:
        type: string
        format: uuid
    TaskId:
      name: taskId
      in: path
      required: true
      description: Human task identifier.
      schema:
        type: string
        format: uuid
    RecordId:
      name: recordId
      in: path
      required: true
      description: Business object record identifier.
      schema:
        type: string
        format: uuid
    AttachmentId:
      name: attachmentId
      in: path
      required: true
      description: Uploaded file identifier.
      schema:
        type: string
        format: uuid
    UserId:
      name: userId
      in: path
      required: true
      description: Account identifier.
      schema:
        type: string
        format: uuid
    AdminKey:
      name: key
      in: path
      required: true
      description: Stable key of a department or a role.
      schema:
        type: string
        pattern: '^[a-z][a-z0-9_]{1,63}$'
  responses:
    BadRequest:
      description: The request body or parameters are invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: The addressed resource does not exist
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceUnavailable:
      description: The database dependency is unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: No session, or the session expired
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: The signed-in user does not hold the required role
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: The addressed resource moved while the request was in flight
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, unavailable]
    Meta:
      type: object
      required: [name, version, stage]
      properties:
        name:
          type: string
          example: OPVARYN
        version:
          type: string
          example: 0.1.0
        stage:
          type: string
          enum: [demo, mvp, production]
          example: demo
    ErrorResponse:
      type: object
      required: [code, message]
      description: |
        Stable error envelope. `code` is a machine-readable identifier; clients switch on
        it and never on the human-readable message.
      properties:
        code:
          type: string
          example: invalid_request
        message:
          type: string
          example: 'key: must match ^[a-z][a-z0-9_]{1,63}$'
    FieldType:
      type: string
      description: Field kinds supported by the form builder.
      enum: [text, number, date, select, file, rows, table, formula]
    FieldOption:
      type: object
      description: One selectable option of a `select` field.
      required: [value, label]
      properties:
        value:
          type: string
          minLength: 1
          maxLength: 120
          example: kinh_doanh
        label:
          type: string
          minLength: 1
          maxLength: 120
          example: Kinh doanh
    FieldColumn:
      type: object
      description: One typed column of a `table` field (ADR 0032).
      required: [key, label, type]
      properties:
        key:
          type: string
          example: price
        label:
          type: string
          example: Giá
        type:
          type: string
          enum: [text, number, date]
    FieldCondition:
      type: object
      description: |
        A condition on a field: the field is shown when it holds (ADR 0032). It is the same
        shape as the condition of a process step.
      required: [field, op]
      properties:
        field:
          type: string
          example: quantity
        op:
          type: string
          enum: [eq, ne, gt, gte, lt, lte]
        value: {}
    FieldDefinition:
      type: object
      required: [key, label, type]
      properties:
        key:
          type: string
          example: estimated_amount
        label:
          type: string
          example: Số tiền dự kiến
        type:
          $ref: '#/components/schemas/FieldType'
        required:
          type: boolean
          default: false
        options:
          type: array
          description: Allowed options. Required for `select` fields, rejected on other types.
          items:
            $ref: '#/components/schemas/FieldOption'
        formula:
          type: string
          description: |
            The expression of a computed field (ADR 0032), for example "quantity * unit_price".
            The server calculates it; the person never types it.
          example: quantity * unit_price
        visibleWhen:
          $ref: '#/components/schemas/FieldCondition'
        columns:
          type: array
          description: The typed columns of a `table` field (ADR 0032).
          items:
            $ref: '#/components/schemas/FieldColumn'
    BusinessObject:
      type: object
      required: [id, key, name, fields, version, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        key:
          type: string
        name:
          type: string
        description:
          type: string
        fields:
          type: array
          description: Schema of the newest published version.
          items:
            $ref: '#/components/schemas/FieldDefinition'
        version:
          type: integer
          minimum: 1
          description: Newest published version number; records bind to the version they were created under.
          example: 2
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    BusinessObjectList:
      type: object
      required: [data, total]
      properties:
        total:
          type: integer
          description: Definitions behind the page. A caller paginates with it instead of asking for everything.
          example: 42
        data:
          type: array
          items:
            $ref: '#/components/schemas/BusinessObject'
    CreateBusinessObjectRequest:
      type: object
      required: [key, name]
      properties:
        key:
          type: string
          pattern: '^[a-z][a-z0-9_]{1,63}$'
          example: purchase_request
        name:
          type: string
          minLength: 1
          maxLength: 120
          example: Đề nghị mua hàng
        description:
          type: string
          maxLength: 500
        fields:
          type: array
          items:
            $ref: '#/components/schemas/FieldDefinition'
    ObjectRecord:
      type: object
      required: [id, objectKey, objectVersion, values, canEdit, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        objectKey:
          type: string
          description: Key of the business object this record belongs to.
        objectVersion:
          type: integer
          minimum: 1
          description: Definition version the record was created under; its values are read with that schema.
          example: 1
        values:
          type: object
          additionalProperties: true
          description: Field key → value map. Values are validated against the field definitions.
        createdByName:
          type: string
          description: |
            Display name of the person who entered the record, so a screen names them instead
            of printing an identifier (ADR 0016). Absent when the account is gone.
        departmentName:
          type: string
          description: Display name of the department the record belongs to; absent when none applies.
        canEdit:
          type: boolean
          description: |
            Whether the signed-in caller satisfies the write rule of ADR 0023 (administrator,
            creator, or a member of the record's department). A display hint only: the API
            checks it again on every update and delete.
        attachmentNames:
          type: object
          description: |
            File name per file-field key, so a screen names the attachment instead of showing
            its identifier. Filled when one record is read.
          additionalProperties:
            type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ObjectRecordList:
      type: object
      required: [data, total]
      properties:
        total:
          type: integer
          description: Records behind the page. A caller paginates with it instead of asking for everything.
          example: 42
        data:
          type: array
          items:
            $ref: '#/components/schemas/ObjectRecord'
    RecordHistoryList:
      type: object
      required: [data, total]
      properties:
        total:
          type: integer
        data:
          type: array
          description: Entries newest first.
          items:
            $ref: '#/components/schemas/RecordHistoryEntry'
    RecordHistoryEntry:
      type: object
      required: [id, action, actorName, changes, createdAt]
      properties:
        id:
          type: integer
          format: int64
        action:
          type: string
          enum: [created, updated, deleted]
        actorName:
          type: string
          description: The name at the time of the change (empty for the system or a gone account).
        changes:
          type: array
          items:
            $ref: '#/components/schemas/RecordHistoryChange'
        createdAt:
          type: string
          format: date-time
    RecordHistoryChange:
      type: object
      required: [fieldLabel, from, to]
      properties:
        fieldLabel:
          type: string
          description: The field's name, not its key.
        from:
          type: string
          description: The value before the change; empty when the field was absent.
        to:
          type: string
          description: The value after the change; empty when the field was cleared.
    RecordImportResult:
      type: object
      required: [dryRun, rows, valid, created, errors]
      properties:
        dryRun:
          type: boolean
        rows:
          type: integer
          description: Data rows found in the file (excluding the header).
        valid:
          type: integer
          description: Rows that passed every check.
        created:
          type: integer
          description: Rows actually stored; zero for a dry run and zero when any row failed.
        errors:
          type: array
          description: '`row` is the spreadsheet line number (the header is line 1).'
          items:
            $ref: '#/components/schemas/RecordImportError'
    RecordImportError:
      type: object
      required: [row, message]
      properties:
        row:
          type: integer
        message:
          type: string
    Attachment:
      type: object
      required: [id, objectKey, fileName, contentType, size, createdAt]
      properties:
        id:
          type: string
          format: uuid
        objectKey:
          type: string
        fileName:
          type: string
          description: Sanitized name shown to people and sent back as the download name.
        contentType:
          type: string
          description: Sniffed from the bytes, not taken from the upload request.
        size:
          type: integer
          format: int64
          description: Size in bytes (the cap is 10 MB).
        createdAt:
          type: string
          format: date-time
    CreateObjectRecordRequest:
      type: object
      required: [values]
      properties:
        values:
          type: object
          additionalProperties: true
          description: |
            Field key → value map. Every key must exist on the object; required fields
            must be present and every value must match the declared field type.
    UpdateBusinessObjectRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
          example: Đề nghị mua hàng
        description:
          type: string
          maxLength: 500
        fields:
          type: array
          description: Full schema of the new version. Omitted means the version keeps no fields.
          items:
            $ref: '#/components/schemas/FieldDefinition'
    BusinessObjectVersion:
      type: object
      required: [id, version, name, fields, publishedAt, publishedBy]
      properties:
        id:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
        name:
          type: string
        description:
          type: string
        fields:
          type: array
          items:
            $ref: '#/components/schemas/FieldDefinition'
        publishedAt:
          type: string
          format: date-time
        publishedBy:
          type: string
          description: |
            The person who published the version: their name, or their address when nobody has
            named them. It is a snapshot, so a later rename does not rewrite the history.
          example: system
    BusinessObjectVersionList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          description: Published versions, newest first.
          items:
            $ref: '#/components/schemas/BusinessObjectVersion'
    ProcessNodeType:
      type: string
      description: Node kinds of the MVP graph (ADR 0007). Other kinds belong to V1.x.
      enum: [start, human_task, condition, end]
    ProcessCondition:
      type: object
      description: |
        The whole rule language of MVP (D04): a field of the bound business object,
        an allowlisted operator and a literal. Validated against the field definition
        when the definition is published.
      required: [field, op, value]
      properties:
        field:
          type: string
          example: estimated_amount
        op:
          type: string
          enum: [eq, ne, gt, gte, lt, lte]
        value:
          nullable: true
          description: Literal compared against the field value (number, string or date string).
          example: 20000000
    ProcessNode:
      type: object
      required: [key, type, title]
      properties:
        key:
          type: string
          pattern: '^[a-z][a-z0-9_]{1,63}$'
        type:
          $ref: '#/components/schemas/ProcessNodeType'
        title:
          type: string
          maxLength: 120
        assigneeRole:
          type: string
          description: Required on human_task nodes; the role that receives the task (D08b).
          example: truong_bo_phan
        condition:
          $ref: '#/components/schemas/ProcessCondition'
        dueInWorkingHours:
          type: integer
          minimum: 0
          maximum: 8760
          description: |
            How many working hours the step has (ADR 0031). Zero means the step has no
            deadline and is never escalated.
          example: 8
        escalateToRole:
          type: string
          description: |
            The role that takes the step over when it runs out of time (ADR 0031). Empty
            means nobody takes over: the step is only reported as late.
          example: giam_doc
    ProcessEdge:
      type: object
      required: [from, to]
      properties:
        from:
          type: string
        to:
          type: string
        when:
          type: string
          enum: ['', 'true', 'false']
          description: Branch selector on edges leaving a condition node.
    ProcessDefinition:
      type: object
      required: [id, key, name, objectKey, nodes, edges, version, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        key:
          type: string
        name:
          type: string
        description:
          type: string
        objectKey:
          type: string
          description: Business object whose records flow through this process.
        version:
          type: integer
          minimum: 1
          description: Newest published version number.
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/ProcessNode'
        edges:
          type: array
          items:
            $ref: '#/components/schemas/ProcessEdge'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ProcessDefinitionList:
      type: object
      required: [data, total]
      properties:
        total:
          type: integer
          description: Definitions behind the page. A caller paginates with it instead of asking for everything.
          example: 42
        data:
          type: array
          items:
            $ref: '#/components/schemas/ProcessDefinition'
    ProcessDefinitionVersion:
      type: object
      required: [id, version, name, objectKey, nodes, edges, publishedAt, publishedBy]
      properties:
        id:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
        name:
          type: string
        description:
          type: string
        objectKey:
          type: string
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/ProcessNode'
        edges:
          type: array
          items:
            $ref: '#/components/schemas/ProcessEdge'
        publishedAt:
          type: string
          format: date-time
        publishedBy:
          type: string
          description: |
            The person who published the version: their name, or their address when nobody has
            named them. It is a snapshot, so a later rename does not rewrite the history.
    ProcessDefinitionVersionList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          description: Published versions, newest first.
          items:
            $ref: '#/components/schemas/ProcessDefinitionVersion'
    CreateProcessDefinitionRequest:
      type: object
      required: [key, name, objectKey, nodes, edges]
      properties:
        key:
          type: string
          pattern: '^[a-z][a-z0-9_]{1,63}$'
          example: purchase_approval
        name:
          type: string
          minLength: 1
          maxLength: 120
          example: Duyệt đề nghị mua hàng
        description:
          type: string
          maxLength: 500
        objectKey:
          type: string
          example: purchase_request
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/ProcessNode'
        edges:
          type: array
          items:
            $ref: '#/components/schemas/ProcessEdge'
    UpdateProcessDefinitionRequest:
      type: object
      required: [name, objectKey, nodes, edges]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          maxLength: 500
        objectKey:
          type: string
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/ProcessNode'
        edges:
          type: array
          items:
            $ref: '#/components/schemas/ProcessEdge'
    ProcessInstanceState:
      type: string
      enum: [running, completed, rejected]
    ProcessTaskStatus:
      type: string
      enum: [open, approved, returned, rejected, cancelled]
    ProcessTask:
      type: object
      required: [id, nodeKey, title, assigneeRole, attempt, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        nodeKey:
          type: string
        title:
          type: string
        assigneeRole:
          type: string
        attempt:
          type: integer
          minimum: 1
        status:
          $ref: '#/components/schemas/ProcessTaskStatus'
        reason:
          type: string
        decidedBy:
          type: string
        createdAt:
          type: string
          format: date-time
        decidedAt:
          type: string
          format: date-time
        dueAt:
          type: string
          format: date-time
          description: |
            When the step runs out of time, counted in the organisation's working hours
            (ADR 0031). Absent when the step has no deadline.
        escalated:
          type: boolean
          description: Whether the step was already taken over once (ADR 0031).
    ProcessEvent:
      type: object
      required: [id, type, actor, payload, createdAt]
      properties:
        id:
          type: integer
          format: int64
        type:
          type: string
          example: task_approved
        nodeKey:
          type: string
        actor:
          type: string
        payload:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
    ProcessInstance:
      type: object
      required: [id, definitionKey, definitionVersion, objectKey, recordId, state, currentNode, attempt, startedAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        definitionKey:
          type: string
        definitionVersion:
          type: integer
          minimum: 1
          description: Definition version this instance is bound to; later publishes do not change it.
        objectKey:
          type: string
        recordId:
          type: string
          format: uuid
        state:
          $ref: '#/components/schemas/ProcessInstanceState'
        currentNode:
          type: string
        attempt:
          type: integer
          minimum: 1
          description: Incremented every time a return resets the instance.
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    InboxItem:
      type: object
      required: [task, instance]
      properties:
        task:
          $ref: '#/components/schemas/ProcessTask'
        instance:
          $ref: '#/components/schemas/ProcessInstance'
        recordName:
          type: string
          description: |
            The value that identifies the record this task runs on, read with the definition
            version that record was created under. Empty when the record has no readable
            name; a screen then says so instead of printing an id (ADR 0018).
    InboxList:
      type: object
      required: [data, total]
      properties:
        total:
          type: integer
          description: Open tasks behind the page. A caller paginates with it instead of asking for everything.
          example: 42
        data:
          type: array
          description: Open tasks of the signed-in user, oldest first.
          items:
            $ref: '#/components/schemas/InboxItem'
    ProcessInstanceView:
      type: object
      required: [instance, tasks, events]
      properties:
        instance:
          $ref: '#/components/schemas/ProcessInstance'
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/ProcessTask'
        events:
          type: array
          description: Append-only audit log, oldest first.
          items:
            $ref: '#/components/schemas/ProcessEvent'
    ProcessInstanceSummary:
      type: object
      required: [instance, openTasks]
      properties:
        instance:
          $ref: '#/components/schemas/ProcessInstance'
        openTasks:
          type: array
          description: The tasks of this instance still waiting on a decision.
          items:
            $ref: '#/components/schemas/ProcessTask'
        recordName:
          type: string
          description: |
            The value that identifies the record this run works on, read with the definition
            version that record was created under. Empty when the record has no readable
            name; a screen then says so instead of printing an id (ADR 0018).
    ProcessInstanceList:
      type: object
      required: [data, total]
      properties:
        total:
          type: integer
          description: Visible instances behind the page. A caller paginates with it instead of asking for everything.
          example: 42
        data:
          type: array
          description: Visible instances, newest first.
          items:
            $ref: '#/components/schemas/ProcessInstanceSummary'
    ChangeMyPasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          description: The password the person signs in with today.
        newPassword:
          type: string
          description: At least 10 characters and different from the current one.
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          example: lan@example.com
        password:
          type: string
          minLength: 1
          example: correct horse battery staple
        code:
          type: string
          description: |
            The code of the authenticator app, when the account has the second step switched
            on (ADR 0030). A recovery code works here too, once.
          example: "123456"
    WorkingHour:
      type: object
      required: [weekday, start, end]
      properties:
        weekday:
          type: integer
          minimum: 0
          maximum: 6
          description: The day of the week; 0 is Sunday.
          example: 1
        start:
          type: integer
          minimum: 0
          maximum: 1440
          description: When the stretch starts, in minutes from midnight.
          example: 540
        end:
          type: integer
          minimum: 0
          maximum: 1440
          description: When the stretch ends, in minutes from midnight.
          example: 1020
    WorkingHours:
      type: object
      required: [data]
      properties:
        data:
          type: array
          description: The stretches of the week, ordered by day.
          items:
            $ref: '#/components/schemas/WorkingHour'
    WorkingHoursRequest:
      type: object
      required: [data]
      properties:
        data:
          type: array
          description: The stretches of the week; the calendar is replaced as a whole.
          items:
            $ref: '#/components/schemas/WorkingHour'
    TwoFactorStatus:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean
          description: Whether the second step is switched on for this account.
    TwoFactorSetup:
      type: object
      required: [secret, uri]
      properties:
        secret:
          type: string
          description: The shared secret, in base32. Type it into the authenticator app.
        uri:
          type: string
          description: The link an authenticator app reads.
    TwoFactorEnabled:
      type: object
      required: [recoveryCodes]
      properties:
        recoveryCodes:
          type: array
          description: Single-use codes, shown once. Keep them where the passwords are kept.
          items:
            type: string
    TwoFactorCodeRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          minLength: 1
          description: The code of the authenticator app, or one of the recovery codes.
    Me:
      type: object
      required: [id, email, name, department, departmentName, roles, roleLabels]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        name:
          type: string
        department:
          type: string
          description: Department key (D09b scoping). Keys are for the engine, not for screens.
        departmentName:
          type: string
          description: Display name of the department, for screens (ADR 0016).
          example: Kỹ thuật
        roles:
          type: array
          description: Role keys the person holds; these are what authorization compares.
          items:
            type: string
        roleLabels:
          type: object
          description: |
            Display name per role key the person holds. A role nobody has named is absent, so
            the caller shows the key for it (ADR 0016).
          additionalProperties:
            type: string
          example: { truong_bo_phan: Trưởng bộ phận }
    StartProcessInstanceRequest:
      type: object
      required: [definitionKey, recordId]
      properties:
        definitionKey:
          type: string
        recordId:
          type: string
          format: uuid
    RoleList:
      type: object
      required: [data, total]
      properties:
        total:
          type: integer
          description: Roles behind the page. A caller paginates with it instead of asking for everything.
          example: 4
        data:
          type: array
          description: Roles held by at least one user, sorted by key.
          items:
            $ref: '#/components/schemas/RoleEntry'
    RoleEntry:
      type: object
      required: [key, label]
      properties:
        key:
          type: string
          description: The key a process node assigns and authorization compares.
          example: truong_bo_phan
        label:
          type: string
          description: Display name; empty when the role has not been named yet.
          example: Trưởng bộ phận
    AdminUserStatus:
      type: string
      enum: [active, disabled]
      description: A disabled account keeps its history but cannot sign in.
    AdminUser:
      type: object
      required:
        [id, email, name, department, departmentName, roles, roleLabels, status, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        name:
          type: string
        department:
          type: string
          description: Department key (D09b scoping). Keys are for the engine, not for screens.
        departmentName:
          type: string
          description: Display name of the department, for screens (ADR 0016).
          example: Kỹ thuật
        roles:
          type: array
          items:
            type: string
        roleLabels:
          type: object
          description: Display name per role key. A role nobody has named is absent.
          additionalProperties:
            type: string
        status:
          $ref: '#/components/schemas/AdminUserStatus'
        lockedUntil:
          type: string
          format: date-time
          description: |
            When the sign-in cooldown of this address ends (ADR 0028). Absent when the account
            can sign in normally. Only the administration area reads it.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    AdminUserList:
      type: object
      required: [data, total]
      properties:
        total:
          type: integer
          description: Accounts behind the page.
        data:
          type: array
          description: One page of accounts, ordered by email.
          items:
            $ref: '#/components/schemas/AdminUser'
    CreateAdminUserRequest:
      type: object
      required: [email, name, password, department, roles]
      properties:
        email:
          type: string
          example: lan@example.com
        name:
          type: string
          example: Nguyễn Thị Lan
        password:
          type: string
          description: At least 10 characters; stored only as an argon2id PHC string.
        department:
          type: string
          description: Key of an existing department.
          example: ky_thuat
        roles:
          type: array
          description: At least one role key.
          minItems: 1
          items:
            type: string
    UpdateAdminUserRequest:
      type: object
      required: [email, name, department, roles, status]
      properties:
        email:
          type: string
        name:
          type: string
        department:
          type: string
        roles:
          type: array
          description: The complete role set; it replaces what the person held.
          minItems: 1
          items:
            type: string
        status:
          $ref: '#/components/schemas/AdminUserStatus'
    SetAdminUserPasswordRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string
          description: At least 10 characters.
    AdminDepartment:
      type: object
      required: [key, name, userCount, createdAt]
      properties:
        key:
          type: string
          example: ky_thuat
        name:
          type: string
          example: Kỹ thuật
        userCount:
          type: integer
          description: People whose department is this one; a department with people cannot be deleted.
        createdAt:
          type: string
          format: date-time
    AdminDepartmentList:
      type: object
      required: [data, total]
      properties:
        total:
          type: integer
        data:
          type: array
          items:
            $ref: '#/components/schemas/AdminDepartment'
    CreateAdminDepartmentRequest:
      type: object
      required: [key, name]
      properties:
        key:
          type: string
          pattern: '^[a-z][a-z0-9_]{1,63}$'
          example: ky_thuat
        name:
          type: string
          example: Kỹ thuật
    UpdateAdminDepartmentRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          example: Kỹ thuật và hạ tầng
    AdminRole:
      type: object
      required: [key, label, isSystem, userCount, createdAt]
      properties:
        key:
          type: string
          example: truong_bo_phan
        label:
          type: string
          description: Display name.
          example: Trưởng bộ phận
        isSystem:
          type: boolean
          description: Platform roles (admin, process_designer) may be renamed but not deleted.
        userCount:
          type: integer
          description: People holding the role; a held role cannot be deleted.
        createdAt:
          type: string
          format: date-time
    AdminRoleList:
      type: object
      required: [data, total]
      properties:
        total:
          type: integer
        data:
          type: array
          items:
            $ref: '#/components/schemas/AdminRole'
    CreateAdminRoleRequest:
      type: object
      required: [key, label]
      properties:
        key:
          type: string
          pattern: '^[a-z][a-z0-9_]{1,63}$'
          example: truong_bo_phan
        label:
          type: string
          example: Trưởng bộ phận
    UpdateAdminRoleRequest:
      type: object
      required: [label]
      properties:
        label:
          type: string
          example: Trưởng bộ phận
    MetricAggregation:
      type: string
      enum: [count, sum, avg]
      description: Count records, or measure one numeric field.
    MetricValueKind:
      type: string
      enum: [text, number, date]
      description: |
        The kind of a field, resolved when the metric was saved. It decides which typed
        column the metric filters, groups or measures on.
    MetricFieldRef:
      type: object
      required: [key, kind]
      properties:
        key:
          type: string
        kind:
          $ref: '#/components/schemas/MetricValueKind'
    MetricFilter:
      type: object
      required: [field, kind, op, value]
      properties:
        field:
          type: string
        kind:
          $ref: '#/components/schemas/MetricValueKind'
        op:
          type: string
          enum: [eq, ne, gt, gte, lt, lte]
        value:
          description: The literal to compare against, typed by the field.
      description: The single filter a metric carries, using the D04 condition shape.
    MetricDefinition:
      type: object
      required: [id, key, name, objectKey, aggregation, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        key:
          type: string
        name:
          type: string
        description:
          type: string
        objectKey:
          type: string
        aggregation:
          $ref: '#/components/schemas/MetricAggregation'
        measure:
          allOf:
            - $ref: '#/components/schemas/MetricFieldRef'
          description: The numeric field for sum and avg; absent for count.
        filter:
          allOf:
            - $ref: '#/components/schemas/MetricFilter'
          description: Optional filter, absent when the metric measures everything.
        groupBy:
          allOf:
            - $ref: '#/components/schemas/MetricFieldRef'
          description: Optional grouping field; absent for a single number.
        createdBy:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    InstanceCounts:
      type: object
      required: [started, completed, rejected, running]
      properties:
        started:
          type: integer
          format: int64
          minimum: 0
        completed:
          type: integer
          format: int64
          minimum: 0
        rejected:
          type: integer
          format: int64
          minimum: 0
        running:
          type: integer
          format: int64
          minimum: 0
    DurationStats:
      type: object
      required: [averageSeconds, medianSeconds, samples]
      properties:
        averageSeconds:
          type: number
          format: double
          minimum: 0
        medianSeconds:
          type: number
          format: double
          minimum: 0
        samples:
          type: integer
          format: int64
          minimum: 0
          description: How many measurements the numbers rest on.
    WebhookDelivery:
      type: object
      required: [id, event, instanceId, status, attempts, nextAttemptAt, createdAt]
      properties:
        id:
          type: string
          format: uuid
        event:
          type: string
          example: task_created
        instanceId:
          type: string
          format: uuid
        taskId:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending, delivered, failed]
        attempts:
          type: integer
          minimum: 0
        nextAttemptAt:
          type: string
          format: date-time
        lastStatusCode:
          type: integer
        lastError:
          type: string
        createdAt:
          type: string
          format: date-time
        deliveredAt:
          type: string
          format: date-time
    WebhookDeliveryList:
      type: object
      required: [enabled, data, total]
      properties:
        enabled:
          type: boolean
          description: Whether an endpoint is configured; when false nothing is queued.
        total:
          type: integer
          description: Deliveries behind the page. A caller paginates with it instead of asking for everything.
          example: 120
        data:
          type: array
          description: Newest first.
          items:
            $ref: '#/components/schemas/WebhookDelivery'
    ProcessMetricsOverview:
      type: object
      required: [windowDays, definitionKey, instances, cycleTime, stepTime, generatedAt]
      properties:
        windowDays:
          type: integer
          minimum: 1
        definitionKey:
          type: string
          description: Empty means every process definition.
        instances:
          $ref: '#/components/schemas/InstanceCounts'
        cycleTime:
          allOf:
            - $ref: '#/components/schemas/DurationStats'
          description: From instance start to finish, over instances finished in the window.
        stepTime:
          allOf:
            - $ref: '#/components/schemas/DurationStats'
          description: From task creation to decision, over tasks decided in the window.
        approvalRate:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: Completed / (completed + rejected). Absent when nothing finished.
        reworkRate:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: Share of instances that needed more than one attempt. Absent with no instances.
        generatedAt:
          type: string
          format: date-time
    MetricDefinitionList:
      type: object
      required: [data, total]
      properties:
        total:
          type: integer
          description: Metric definitions behind the page. A caller paginates with it instead of asking for everything.
          example: 3
        data:
          type: array
          description: Metric definitions, ordered by key.
          items:
            $ref: '#/components/schemas/MetricDefinition'
    MetricDefinitionRequest:
      type: object
      required: [name, objectKey, aggregation]
      properties:
        name:
          type: string
          maxLength: 120
        description:
          type: string
          maxLength: 500
        objectKey:
          type: string
          example: purchase_request
        aggregation:
          $ref: '#/components/schemas/MetricAggregation'
        field:
          type: string
          description: The numeric field to measure; must be empty for count.
        filter:
          allOf:
            - $ref: '#/components/schemas/ProcessCondition'
          description: Optional filter with the same shape process branches use.
        groupBy:
          type: string
          description: Optional select, text or date field to group by.
    CreateMetricDefinitionRequest:
      allOf:
        - $ref: '#/components/schemas/MetricDefinitionRequest'
        - type: object
          required: [key]
          properties:
            key:
              type: string
              example: purchase_requests_open
    UpdateMetricDefinitionRequest:
      $ref: '#/components/schemas/MetricDefinitionRequest'
    MetricBucket:
      type: object
      required: [key, records, value]
      properties:
        key:
          type: string
          description: The grouping value.
        records:
          type: integer
          format: int64
          minimum: 0
        value:
          type: number
          format: double
    MetricResult:
      type: object
      required: [metric, total, records, buckets]
      properties:
        metric:
          $ref: '#/components/schemas/MetricDefinition'
        total:
          type: number
          format: double
          description: The aggregate over every record the caller may see.
        records:
          type: integer
          format: int64
          minimum: 0
          description: How many records the value rests on.
        buckets:
          type: array
          description: Biggest 50 groups, empty when the metric does not group.
          items:
            $ref: '#/components/schemas/MetricBucket'
    DecideProcessTaskRequest:
      type: object
      required: [decision]
      properties:
        decision:
          type: string
          enum: [approve, return, reject]
        reason:
          type: string
          maxLength: 500
          description: Required for return and reject decisions.
