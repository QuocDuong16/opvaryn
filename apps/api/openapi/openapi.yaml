openapi: 3.0.3
info:
  title: OPVARYN API
  version: 0.1.0
  description: |
    Interactive demo API for OPVARYN — Business Operations Platform.

    This document is the single source of truth for the HTTP contract. Go types in
    `apps/api/internal/api/v1/types.gen.go` and TypeScript types in
    `packages/contracts/src/generated/schema.ts` are generated from it with
    `make contract-generate`; never edit the generated files by hand.

    Scope note: the workflow runtime is intentionally absent. It is implemented only
    after the process execution contract decisions in
    `operations-playbook/architecture.html` (section 04) are made.
servers:
  - url: http://localhost:21501
    description: Local development
tags:
  - name: system
    description: Health, readiness and product metadata
  - name: business-objects
    description: Business object definitions (demo vertical slice)
  - name: object-records
    description: Records stored against a business object definition
  - name: identity
    description: Sign in, sign out and the current user
  - name: administration
    description: Organisation administration for administrators (users, departments, roles)
  - name: attachments
    description: Files uploaded for a record field (ADR 0025)
  - name: task-inbox
    description: The open tasks of the signed-in user
paths:
  /healthz:
    get:
      operationId: getHealth
      tags: [system]
      summary: Liveness probe
      description: Returns ok while the process is serving requests.
      responses:
        '200':
          description: Service is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
  /readyz:
    get:
      operationId: getReadiness
      tags: [system]
      summary: Readiness probe
      description: Returns ok only when the database dependency is reachable.
      responses:
        '200':
          description: Service and dependencies are ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '503':
          description: A dependency is unavailable; the response body still follows HealthStatus
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
  /api/v1/meta:
    get:
      operationId: getMeta
      tags: [system]
      summary: Product metadata
      description: Identifies the running build. The web shell uses it to show the demo stage.
      responses:
        '200':
          description: Product name, version and delivery stage
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Meta'
  /api/v1/business-objects:
    get:
      operationId: listBusinessObjects
      tags: [business-objects]
      summary: List business object definitions
      description: |
        Returns one page of business object definitions, with the total behind it, so a
        screen can paginate without a second request. `q` searches the name and the key.
      parameters:
        - name: q
          in: query
          required: false
          description: Search term matched against the name and the key. Empty means no filter.
          schema:
            type: string
            maxLength: 100
        - name: limit
          in: query
          required: false
          description: Rows per page (default 25, maximum 100).
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: offset
          in: query
          required: false
          description: Rows to skip.
          schema:
            type: integer
            minimum: 0
            default: 0
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Business object definitions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessObjectList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      operationId: createBusinessObject
      tags: [business-objects]
      summary: Create a business object definition
      description: |
        Creates a business object definition. `key` is the stable machine identifier used
        by forms, workflows and API integrations; it cannot be changed later.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBusinessObjectRequest'
      security:
        - sessionCookie: []
      responses:
        '201':
          description: Business object definition created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessObject'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: A business object with this key already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/business-objects/{key}:
    get:
      operationId: getBusinessObject
      tags: [business-objects]
      summary: Get one business object definition
      description: |
        Returns the definition stored under the given key: its current metadata and the
        newest published version of its schema (`version`).
      parameters:
        - $ref: '#/components/parameters/ObjectKey'
      security:
        - sessionCookie: []
      responses:
        '200':
          description: The business object definition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessObject'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    put:
      operationId: updateBusinessObject
      tags: [business-objects]
      summary: Publish the next version of a business object definition
      description: |
        Updates the definition metadata and publishes the next immutable version of its
        schema. Earlier versions are never modified: records created under them keep their
        schema, so an edit may add, rename or remove fields without rewriting history.
      parameters:
        - $ref: '#/components/parameters/ObjectKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBusinessObjectRequest'
      security:
        - sessionCookie: []
      responses:
        '200':
          description: The definition with its newly published version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessObject'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/business-objects/{key}/versions:
    get:
      operationId: listBusinessObjectVersions
      tags: [business-objects]
      summary: List the published versions of a definition
      description: Returns every published snapshot, newest first.
      parameters:
        - $ref: '#/components/parameters/ObjectKey'
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Published definition versions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessObjectVersionList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/business-objects/{key}/records:
    get:
      operationId: listObjectRecords
      tags: [object-records]
      summary: List records of a business object
      description: |-
        Returns one page of the stored records, newest first, with the total behind it.
        `q` searches inside the stored values.
      parameters:
        - $ref: '#/components/parameters/ObjectKey'
        - name: q
          in: query
          required: false
          description: Search term matched against the stored values. Empty means no filter.
          schema:
            type: string
            maxLength: 100
        - name: limit
          in: query
          required: false
          description: Rows per page (default 25, maximum 100).
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: offset
          in: query
          required: false
          description: Rows to skip.
          schema:
            type: integer
            minimum: 0
            default: 0
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Records of the business object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectRecordList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      operationId: createObjectRecord
      tags: [object-records]
      summary: Create a record of a business object
      description: |
        Stores one record whose `values` are validated against the field definitions of
        the addressed object: unknown field keys, missing required fields and values that
        do not match the declared field type are all rejected.
      parameters:
        - $ref: '#/components/parameters/ObjectKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateObjectRecordRequest'
      security:
        - sessionCookie: []
      responses:
        '201':
          description: Record created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectRecord'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/business-objects/{key}/records/import:
    post:
      operationId: importObjectRecords
      tags: [object-records]
      summary: Import records from a CSV file
      description: |
        Reads a CSV whose first row is the field labels (or the machine keys) of the object's
        newest published version, converts each cell by the field type, and stores every row
        in one transaction. Labels are matched case-insensitively; numbers accept Vietnamese
        formatting (`1.500.000`, `12,5`), dates accept `YYYY-MM-DD` and `DD/MM/YYYY`, a select
        accepts the option label or its value, and a rows cell is split on `;` and newlines.
        File fields cannot be imported: attach the file after the record exists.

        Every row is checked before anything is written: a file with one bad row creates
        nothing and answers the row numbers that need fixing. `dryRun=true` runs the same
        checks without writing. The cap is 500 data rows and 5 MB.
      parameters:
        - $ref: '#/components/parameters/ObjectKey'
        - name: dryRun
          in: query
          required: false
          description: Check the file and report per-row problems without writing anything.
          schema:
            type: boolean
            default: false
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      security:
        - sessionCookie: []
      responses:
        '200':
          description: The rows that are valid and, for a real import, how many were created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordImportResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/business-objects/{key}/records/export:
    get:
      operationId: exportObjectRecords
      tags: [object-records]
      summary: Export the records the caller may read as a CSV file
      description: |
        One CSV file for the records of the addressed object, in scope order (newest first).
        The first line carries the field labels, not the machine keys; select values are
        written as the option a person sees, and rows as one cell with items separated by
        `; `. The file starts with a UTF-8 BOM so Excel opens Vietnamese text correctly, and
        cells that begin with `=`, `+`, `-` or `@` are prefixed with an apostrophe so a stored
        value cannot become a spreadsheet formula.

        Visibility is the record scope of ADR 0008, exactly like the list, and `q` applies
        the same search. A request that would export more than 10,000 rows is refused with
        400: narrow the search instead of asking for the whole table.
      parameters:
        - $ref: '#/components/parameters/ObjectKey'
        - name: q
          in: query
          required: false
          description: Search term matched against the stored values. Empty means no filter.
          schema:
            type: string
            maxLength: 100
      security:
        - sessionCookie: []
      responses:
        '200':
          description: UTF-8 CSV (with BOM); the first line is the field labels
          content:
            text/csv:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/business-objects/{key}/records/{recordId}:
    get:
      operationId: getObjectRecord
      tags: [object-records]
      summary: Read one record
      description: |
        One record of the addressed object. Visibility is the record scope of ADR 0008, the
        same rule the list applies; a record the caller may not read answers 404.
      parameters:
        - $ref: '#/components/parameters/ObjectKey'
        - $ref: '#/components/parameters/RecordId'
      security:
        - sessionCookie: []
      responses:
        '200':
          description: The record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectRecord'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    put:
      operationId: updateObjectRecord
      tags: [object-records]
      summary: Replace the values of one record
      description: |
        Replaces the record's values. They are validated against the field definitions of the
        version the record was created under — never the newest schema — and the typed
        projection is rewritten in the same transaction. The record's object, version and
        creator never change.

        Writing needs more than reading: an administrator, the person who created the record,
        or a member of the record's department. A caller who may read a record through an open
        task but does not belong to either group answers 403.
      parameters:
        - $ref: '#/components/parameters/ObjectKey'
        - $ref: '#/components/parameters/RecordId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateObjectRecordRequest'
      security:
        - sessionCookie: []
      responses:
        '200':
          description: The updated record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectRecord'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    delete:
      operationId: deleteObjectRecord
      tags: [object-records]
      summary: Delete one record
      description: |
        Deletes a record that no process has ever run on. A record with a process instance is
        refused with the `in_use` code: its runs and their audit trail are the history of a
        decision, and deleting the record would take that history with it.
      parameters:
        - $ref: '#/components/parameters/ObjectKey'
        - $ref: '#/components/parameters/RecordId'
      security:
        - sessionCookie: []
      responses:
        '204':
          description: The record is gone
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: A process instance still refers to the record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/business-objects/{key}/records/{recordId}/history:
    get:
      operationId: listObjectRecordHistory
      tags: [object-records]
      summary: The change history of one record
      description: |
        Append-only history: who created, changed or deleted the record and which fields
        changed, newest first. Field labels and values are rendered for a person; the stored
        values (not identifiers) are what the history keeps. Visibility is the record scope —
        a hidden record answers 404. The history outlives the record, so a deleted record's
        entries are not removed by the record's deletion.
      parameters:
        - $ref: '#/components/parameters/ObjectKey'
        - $ref: '#/components/parameters/RecordId'
        - name: limit
          in: query
          required: false
          description: Rows per page (default 25, maximum 100).
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: offset
          in: query
          required: false
          description: Rows to skip.
          schema:
            type: integer
            minimum: 0
            default: 0
      security:
        - sessionCookie: []
      responses:
        '200':
          description: One page of history entries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordHistoryList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/auth/login:
    post:
      operationId: login
      tags: [identity]
      summary: Sign in and open a session
      description: |
        Verifies email and password and sets the httpOnly session cookie. An unknown email
        and a wrong password answer identically, so the endpoint cannot be used to discover
        which addresses exist.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: The signed-in user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/auth/logout:
    post:
      operationId: logout
      tags: [identity]
      summary: End the current session
      responses:
        '204':
          description: The session is gone (an unknown session is not an error)
  /api/v1/me/two-factor:
    get:
      operationId: getMyTwoFactor
      tags: [identity]
      summary: Whether this account has the second step switched on
      description: |
        Two-step verification (ADR 0030). The check is for the signed-in person, so a screen
        can say what is missing without asking for a code.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: The state of the second step
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TwoFactorStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      operationId: setupMyTwoFactor
      tags: [identity]
      summary: Prepare the second step
      description: |
        Makes a fresh shared secret and returns it once, together with the link an
        authenticator app reads. The secret is stored sealed, but the second step is not in
        use until the person proves the app works with `enableMyTwoFactor`.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: The secret to type into the app
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TwoFactorSetup'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/me/two-factor/enable:
    post:
      operationId: enableMyTwoFactor
      tags: [identity]
      summary: Switch the second step on
      description: |
        Checks the code the app produced and, when it matches, switches the second step on
        and hands out the single-use recovery codes — shown once, here.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TwoFactorCodeRequest'
      responses:
        '200':
          description: The recovery codes, shown once
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TwoFactorEnabled'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/me/two-factor/disable:
    post:
      operationId: disableMyTwoFactor
      tags: [identity]
      summary: Switch the second step off
      description: |
        Checks the code of the app, or one of the recovery codes, and switches the second
        step off.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TwoFactorCodeRequest'
      responses:
        '204':
          description: The second step is off
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/me:
    get:
      operationId: getMe
      tags: [identity]
      summary: The signed-in user with roles and department
      security:
        - sessionCookie: []
      responses:
        '200':
          description: The current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/me/password:
    post:
      operationId: changeMyPassword
      tags: [identity]
      summary: Change the signed-in user's password
      description: |
        Verifies the current password, stores a new argon2id hash and ends every *other*
        session of that person: the session making the request keeps working, so nobody is
        signed out of the device they are standing at. An administrator reset is the way to
        take an account back (`POST /admin/users/{userId}/password`).
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeMyPasswordRequest'
      responses:
        '204':
          description: The password changed and the other sessions are gone
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/roles:
    get:
      operationId: listRoles
      tags: [identity]
      summary: The role catalogue (every role at least one user holds)
      description: |
        What the workflow designer offers when a human task needs a role: a definition
        that assigns a role nobody holds would wait forever, because an instance stops
        at that node until someone is granted the role. Role names already appear in
        every definition the caller can read, so this exposes nothing new.
      security:
        - sessionCookie: []
      parameters:
        - name: limit
          in: query
          required: false
          description: Rows per page (default 25, maximum 100).
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: offset
          in: query
          required: false
          description: Rows to skip.
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Role keys, sorted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/admin/users:
    get:
      operationId: listAdminUsers
      tags: [administration]
      summary: List people, one page at a time
      description: |
        Administration view of the organisation: every account, its department, its roles and
        whether it may sign in. `q` searches the email and the name. The caller must hold the
        `admin` role; a missing role answers 403. An account that is waiting out a sign-in
        cooldown carries `lockedUntil` (ADR 0028).
      parameters:
        - name: q
          in: query
          required: false
          description: Search term matched against the email and the name.
          schema:
            type: string
            maxLength: 100
        - name: limit
          in: query
          required: false
          description: Rows per page (default 25, maximum 100).
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: offset
          in: query
          required: false
          description: Rows to skip.
          schema:
            type: integer
            minimum: 0
            default: 0
      security:
        - sessionCookie: []
      responses:
        '200':
          description: One page of accounts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      operationId: createAdminUser
      tags: [administration]
      summary: Create one account
      description: |
        Creates a person with a password, a department and at least one role. The first
        administrator cannot come from here: the bootstrap account is created with
        `make useradm` (ADR 0008).
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
