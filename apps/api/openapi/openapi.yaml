      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: The account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    put:
      operationId: updateAdminUser
      tags: [administration]
      summary: Replace an account's profile and roles
      description: |
        Replaces the editable profile and the complete role set. Disabling an account ends its
        sessions immediately. The API refuses to disable the signed-in account or to remove the
        last active administrator.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAdminUserRequest'
      responses:
        '200':
          description: The updated account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/admin/users/{userId}/password:
    post:
      operationId: setAdminUserPassword
      tags: [administration]
      summary: Replace an account's password
      description: |
        Sets a new password and ends every existing session of that person, so a reset also
        takes back an account somebody else may still be using.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetAdminUserPasswordRequest'
      responses:
        '204':
          description: The password changed and the sessions are gone
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/admin/users/{userId}/unlock:
    post:
      operationId: unlockAdminUser
      tags: [administration]
      summary: Clear the sign-in cooldown of one account
      description: |
        Ends the short wait an address gets after too many wrong passwords (ADR 0028). The
        person signs in with the right password again right away. The password is not changed
        and no session is touched.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '204':
          description: The account can sign in again
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/admin/users/{userId}/two-factor:
    get:
      operationId: getAdminUserTwoFactor
      tags: [administration]
      summary: Whether one account has the second step switched on
      description: |
        What the administration screen needs to decide whether to offer the reset (ADR 0030).
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: The state of the second step
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TwoFactorStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/admin/users/{userId}/two-factor/reset:
    post:
      operationId: resetAdminUserTwoFactor
      tags: [administration]
      summary: Turn the second step off for one account
      description: |
        The way back in when a person lost the device (ADR 0030). The account keeps its
        password; only the second step is removed. The person can switch it on again.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '204':
          description: The second step is off
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/admin/users/{userId}/sessions:
    delete:
      operationId: revokeAdminUserSessions
      tags: [administration]
      summary: End every session of one account
      description: |
        Signs the person out everywhere without changing the password. Useful before handing
        an account to somebody else, or after a device went missing.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '204':
          description: No session of that person remains
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/admin/departments:
    get:
      operationId: listAdminDepartments
      tags: [administration]
      summary: List departments with head counts
      parameters:
        - name: q
          in: query
          required: false
          description: Search term matched against the name and the key.
          schema:
            type: string
            maxLength: 100
        - name: limit
          in: query
          required: false
          description: Rows per page (default 25, maximum 100).
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: offset
          in: query
          required: false
          description: Rows to skip.
          schema:
            type: integer
            minimum: 0
            default: 0
      security:
        - sessionCookie: []
      responses:
        '200':
          description: One page of departments
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminDepartmentList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      operationId: createAdminDepartment
      tags: [administration]
      summary: Add one department
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAdminDepartmentRequest'
      responses:
        '201':
          description: The created department
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminDepartment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/admin/departments/{key}:
    put:
      operationId: updateAdminDepartment
      tags: [administration]
      summary: Rename one department
      description: The key is the scope value stored on records, so it never changes.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/AdminKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAdminDepartmentRequest'
      responses:
        '200':
          description: The updated department
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminDepartment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    delete:
      operationId: deleteAdminDepartment
      tags: [administration]
      summary: Delete an empty department
      description: |
        Refused while people belong to it or stored records name it as their scope: deleting it
        would silently change who can read those records.
