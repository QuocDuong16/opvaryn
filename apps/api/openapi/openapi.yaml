    put:
      operationId: replaceWorkingHours
      tags: [administration]
      summary: Set the organisation's working calendar
      description: |
        Replaces the calendar as a whole: a half-written calendar would make deadlines mean
        something nobody chose.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkingHoursRequest'
      responses:
        '204':
          description: The calendar is set
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/admin/roles:
    get:
      operationId: listAdminRoles
      tags: [administration]
      summary: List the whole role catalogue
      description: |
        Unlike `GET /api/v1/roles`, which lists the roles somebody holds, this lists every role
        in the catalogue, including roles created before they are granted, with the number of
        people holding each one.
      parameters:
        - name: q
          in: query
