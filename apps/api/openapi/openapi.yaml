        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Something still depends on the department
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/admin/working-hours:
    get:
      operationId: listWorkingHours
      tags: [administration]
      summary: The organisation's working calendar
      description: |
        The stretches that count as working time, per weekday (ADR 0031). A deadline is
        counted in these hours, so the calendar decides what "four working hours" means.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: The calendar
          content:
